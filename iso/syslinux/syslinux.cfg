DEFAULT apex
TIMEOUT 150
PROMPT 0

UI menu.c32
MENU TITLE Apex Linux Live & Installation Media
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #9033ffff #a0000000 std
MENU COLOR sel          7;37;40 #e0ffffff #20ffffff all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std
MENU COLOR help         37;40   #c0ffffff #a0000000 std
MENU COLOR timeout_msg  37;40   #80ffffff #00000000 std
MENU COLOR timeout      1;37;40 #c0ffffff #00000000 std
MENU COLOR msg07        37;40   #90ffffff #a0000000 std
MENU COLOR tabmsg       31;40   #30ffffff #00000000 std

LABEL apex
MENU LABEL Apex Linux Live (x86_64, BIOS)
LINUX /apex/boot/x86_64/vmlinuz-linux
INITRD /apex/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=apex archisolabel=APEX_LINUX quiet loglevel=3 cow_spacesize=4G

LABEL apexram
MENU LABEL Apex Linux Live (Copy to RAM)
LINUX /apex/boot/x86_64/vmlinuz-linux
INITRD /apex/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=apex archisolabel=APEX_LINUX copytoram=y quiet loglevel=3 cow_spacesize=4G

LABEL reboot
MENU LABEL Reboot System
COM32 reboot.c32

LABEL poweroff
MENU LABEL Power Off System
COM32 poweroff.c32
