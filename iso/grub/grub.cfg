# Load partition table and file system modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod tftp

# Graphics and font
insmod all_video
insmod font

set default="apex-linux"
set timeout=15

# Color configuration (Cyan and dark slate styling)
set menu_color_normal=light-gray/black
set menu_color_highlight=cyan/black

menuentry "Apex Linux Live & Installation Media (x86_64, UEFI)" --class apex --class arch --class gnu-linux --class gnu --class os --id 'apex-linux' {
    set gfxpayload=keep
    linux /apex/boot/x86_64/vmlinuz-linux archisobasedir=apex archisolabel=APEX_LINUX quiet loglevel=3 cow_spacesize=4G
    initrd /apex/boot/x86_64/initramfs-linux.img
}

menuentry "Apex Linux Live (Copy to RAM)" --class apex --class arch --class gnu-linux --class gnu --class os --id 'apex-linux-ram' {
    set gfxpayload=keep
    linux /apex/boot/x86_64/vmlinuz-linux archisobasedir=apex archisolabel=APEX_LINUX copytoram=y quiet loglevel=3 cow_spacesize=4G
    initrd /apex/boot/x86_64/initramfs-linux.img
}

menuentry "Apex Linux Live with Accessibility Speech" --class apex --class arch --class gnu-linux --class gnu --class os --id 'apex-linux-speech' {
    set gfxpayload=keep
    linux /apex/boot/x86_64/vmlinuz-linux archisobasedir=apex archisolabel=APEX_LINUX quiet loglevel=3 cow_spacesize=4G accessibility=on
    initrd /apex/boot/x86_64/initramfs-linux.img
}

if [ "${grub_platform}" == "efi" ]; then
    menuentry "UEFI Firmware Settings" --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry "Reboot System" --class reboot --id 'reboot' {
    reboot
}

menuentry "Power Off System" --class shutdown --id 'shutdown' {
    halt
}
